[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fake_news"
version = "0.1.0"
description = "Fake news detection on WELFake: shared data loading, cleaning, splits and evaluation."
requires-python = ">=3.10"
# Lower bounds: older versions are untested. The data fingerprint check catches any
# library difference that changes the cleaned data.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbformat", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
